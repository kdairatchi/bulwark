# Android TV — signed release + Play Console upload
#
# Secrets (repo Settings → Secrets and variables → Actions):
#   BULWARK_TV_KEYSTORE_BASE64       base64 of the upload keystore (.jks/.keystore)
#   BULWARK_TV_STORE_PASSWORD        keystore password
#   BULWARK_TV_KEY_ALIAS             key alias
#   BULWARK_TV_KEY_PASSWORD          key password
#   BULWARK_TV_PLAY_SERVICE_ACCOUNT_JSON  Play Console API service-account JSON (plain text)
#
# Triggers:
#   - workflow_dispatch (manual): choose track / whether to upload
#   - push tags matching tv-v* (e.g. tv-v0.1.1) → build + upload to internal as draft
#
# First-time Play Console checklist is in apps/android-tv/docs/play-release.md

name: Android TV Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "versionName (e.g. 0.1.1). Empty = keep gradle default / tag."
        required: false
        default: ""
      version_code:
        description: "versionCode integer. Empty = derive from tag or keep default."
        required: false
        default: ""
      track:
        description: "Play track"
        required: true
        default: internal
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      upload:
        description: "Upload AAB to Play Console (draft)"
        required: true
        default: true
        type: boolean
      status:
        description: "Play release status"
        required: true
        default: draft
        type: choice
        options:
          - draft
          - completed
  push:
    tags:
      - "tv-v*"

permissions:
  contents: read

concurrency:
  group: android-tv-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Fast gate — no signing secrets required
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android-tv
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (:core)
        run: ./gradlew :core:test --no-daemon

  build-signed:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android-tv
    env:
      BULWARK_TV_STORE_PASSWORD: ${{ secrets.BULWARK_TV_STORE_PASSWORD }}
      BULWARK_TV_KEY_ALIAS: ${{ secrets.BULWARK_TV_KEY_ALIAS }}
      BULWARK_TV_KEY_PASSWORD: ${{ secrets.BULWARK_TV_KEY_PASSWORD }}
    outputs:
      aab_path: ${{ steps.paths.outputs.aab }}
      apk_path: ${{ steps.paths.outputs.apk }}
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
    steps:
      - uses: actions/checkout@v7

      - name: Require signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.BULWARK_TV_KEYSTORE_BASE64 }}
        run: |
          missing=0
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Missing secret BULWARK_TV_KEYSTORE_BASE64 — see apps/android-tv/docs/play-release.md"
            missing=1
          fi
          if [ -z "${BULWARK_TV_STORE_PASSWORD:-}" ]; then
            echo "::error::Missing secret BULWARK_TV_STORE_PASSWORD"
            missing=1
          fi
          if [ -z "${BULWARK_TV_KEY_ALIAS:-}" ]; then
            echo "::error::Missing secret BULWARK_TV_KEY_ALIAS"
            missing=1
          fi
          if [ -z "${BULWARK_TV_KEY_PASSWORD:-}" ]; then
            echo "::error::Missing secret BULWARK_TV_KEY_PASSWORD"
            missing=1
          fi
          exit $missing

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.BULWARK_TV_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/bulwark-tv-upload.jks"
          echo "$KEYSTORE_B64" | base64 -d > "$KEYSTORE_PATH"
          echo "BULWARK_TV_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          # Sanity: file non-empty
          test -s "$KEYSTORE_PATH"

      - name: Resolve version
        id: version
        shell: bash
        run: |
          NAME="${{ github.event.inputs.version_name }}"
          CODE="${{ github.event.inputs.version_code }}"
          REF="${GITHUB_REF_NAME}"
          if [ -z "$NAME" ] && [[ "$REF" == tv-v* ]]; then
            NAME="${REF#tv-v}"
          fi
          if [ -z "$NAME" ]; then
            NAME="0.1.0"
          fi
          if [ -z "$CODE" ] && [[ "$REF" == tv-v* ]]; then
            # Derive a monotonic-ish code from semver: major*100000 + minor*1000 + patch
            IFS=. read -r MA MI PA <<< "${NAME%%-*}"
            MA=${MA:-0}; MI=${MI:-0}; PA=${PA:-0}
            CODE=$((MA * 100000 + MI * 1000 + PA))
          fi
          if [ -z "$CODE" ]; then
            CODE=1
          fi
          echo "version_name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "BULWARK_TV_VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "BULWARK_TV_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "Building com.bulwark.tv $NAME ($CODE)"

      - name: Build signed release AAB + APK
        run: |
          ./gradlew :app:bundleRelease :app:assembleRelease --no-daemon
          AAB="app/build/outputs/bundle/release/app-release.aab"
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$AAB"
          test -f "$APK"
          mkdir -p "$GITHUB_WORKSPACE/dist-tv"
          cp "$AAB" "$GITHUB_WORKSPACE/dist-tv/app-release.aab"
          cp "$APK" "$GITHUB_WORKSPACE/dist-tv/app-release.apk"
          if command -v apksigner >/dev/null 2>&1; then
            apksigner verify --print-certs "$APK" || true
          fi

      - name: Record artifact paths
        id: paths
        run: |
          echo "aab=dist-tv/app-release.aab" >> "$GITHUB_OUTPUT"
          echo "apk=dist-tv/app-release.apk" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bulwark-tv-${{ steps.version.outputs.version_name }}
          path: dist-tv/
          if-no-files-found: error
          retention-days: 30

  upload-play:
    needs: build-signed
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/tv-v')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.upload == 'true')
    steps:
      - name: Require Play service account
        env:
          SA: ${{ secrets.BULWARK_TV_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::Missing BULWARK_TV_PLAY_SERVICE_ACCOUNT_JSON — see apps/android-tv/docs/play-release.md"
            exit 1
          fi

      - name: Download AAB artifact
        uses: actions/download-artifact@v4
        with:
          name: bulwark-tv-${{ needs.build-signed.outputs.version_name }}
          path: dist

      - name: Upload to Play Console
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.BULWARK_TV_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.bulwark.tv
          releaseFiles: dist/app-release.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          status: ${{ github.event.inputs.status || 'draft' }}
          releaseName: ${{ needs.build-signed.outputs.version_name }} (${{ needs.build-signed.outputs.version_code }})
