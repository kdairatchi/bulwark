name: Beta artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win
            os: windows-latest
          - target: mac
            os: macos-latest
          - target: linux
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate beta report template
        run: npm run validate:beta-report -- docs/release/beta-report.template.json

      - name: Package unsigned beta artifact
        run: npm run package:${{ matrix.target }} -- --publish never

      - name: Upload beta artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bulwrk-beta-${{ matrix.target }}-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
